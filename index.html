<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaveBuyLib - Liberia's #1 Marketplace</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>body{font-family:sans-serif}.badge-county{background:#0ea5e9;color:white}</style>
</head>
<body class="bg-gray-50">
<header class="sticky top-0 z-50 bg-white border-b p-3 flex justify-between items-center">
<div class="flex items-center gap-2">
<div id="logoBtn" class="w-10 h-10 bg-black rounded-full flex items-center justify-center text-white font-black">W</div>
<div><h1 class="font-black leading-none">WaveBuyLib</h1><p class="text-[9px] text-gray-500">LIBERIA MARKETPLACE</p></div>
</div>
<div class="flex gap-2">
<select id="countyFilter" class="text-xs border rounded-full px-2 py-1"><option value="">All 15 Counties</option><option>Montserrado</option><option>Nimba</option><option>Bong</option><option>Lofa</option><option>Grand Bassa</option><option>Margibi</option><option>Maryland</option><option>Grand Gedeh</option><option>Sinoe</option><option>Rivercess</option><option>Bomi</option><option>Gbarpolu</option><option>Grand Cape Mount</option><option>River Gee</option><option>Grand Kru</option></select>
<button id="cartBtn" class="bg-black text-white rounded-full px-3 py-1 text-xs font-bold">Cart <span id="cartCount">0</span></button>
</div>
</header>

<section class="bg-black text-white p-6">
<h2 class="text-3xl font-black">Liberia's #1<br><span class="text-yellow-400">Marketing Marketplace</span></h2>
<p class="text-sm text-gray-300 mt-2">Buy with Orange Money & MTN MoMo - All 15 Counties - Backend LIVE ✅</p>
<p class="text-xs mt-2 text-yellow-400 font-bold">Press & Hold Logo 2s = Owner Portal (christopher200c@gmail.com)</p>
</section>

<section class="max-w-7xl mx-auto p-4">
<div class="flex gap-2 mb-4"><input id="search" placeholder="Search..." class="border rounded-full px-4 py-2 text-xs flex-1"><select id="catFilter" class="border rounded-full px-3 py-2 text-xs"><option value="">All</option><option>Electronics</option><option>Fashion</option><option>Food</option></select></div>
<div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
</section>

<div id="cartModal" class="hidden fixed inset-0 bg-black/50 z-50 p-4 flex items-end justify-center">
<div class="bg-white rounded-2xl w-full max-w-md p-5">
<h4 class="font-black">Your Cart</h4>
<div id="cartItems" class="mt-3 space-y-2"></div>
<p class="font-black mt-3 flex justify-between"><span>Total</span><span id="cartTotal">L$0</span></p>
<input id="custName" placeholder="Full Name" class="mt-3 w-full border rounded-xl px-3 py-2 text-sm">
<select id="delCounty" class="mt-2 w-full border rounded-xl px-3 py-2 text-sm"><option>Select County</option><option>Montserrado</option><option>Nimba</option><option>Bong</option><option>Lofa</option><option>Grand Bassa</option><option>Margibi</option><option>Maryland</option><option>Grand Gedeh</option><option>Sinoe</option><option>Rivercess</option><option>Bomi</option><option>Gbarpolu</option><option>Grand Cape Mount</option><option>River Gee</option><option>Grand Kru</option></select>
<input id="momoRef" placeholder="MoMo Ref" class="mt-2 w-full border rounded-xl px-3 py-2 text-sm">
<button id="checkoutBtn" class="mt-3 w-full bg-black text-white rounded-full py-3 font-black text-sm">Checkout - Backend /api/orders</button>
<button onclick="document.getElementById('cartModal').classList.add('hidden')" class="mt-2 w-full text-xs">Close</button>
</div>
</div>

<script>
const BACKEND="https://wavebuylib-backend.christopher200c.workers.dev";
let products=[
{id:1,name:"Tecno Spark 20",price:75000,category:"Electronics",county:"Montserrado",image:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400",stock:10},
{id:2,name:"African Print Shirt",price:5000,category:"Fashion",county:"Grand Bassa",image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",stock:20},
{id:3,name:"iPhone 14",price:650000,category:"Electronics",county:"Montserrado",image:"https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?w=400",stock:5},
{id:4,name:"Liberia Rice 25kg",price:25000,category:"Food",county:"Bong",image:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400",stock:100},
{id:5,name:"Infinix Hot 40",price:58000,category:"Electronics",county:"Nimba",image:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400",stock:8},
{id:6,name:"Lappa Bundle",price:3500,category:"Fashion",county:"Grand Bassa",image:"https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?w=400",stock:40}
];
let cart=[],isOwner=false;
async function loadBackend(){try{let r=await fetch(BACKEND+"/api/products");if(r.ok){let d=await r.json();if(Array.isArray(d)&&d.length)products=d;}}catch(e){}render();}
function render(){let g=document.getElementById('productGrid');let s=document.getElementById('search').value.toLowerCase();let cf=document.getElementById('catFilter').value;let countyF=document.getElementById('countyFilter').value;let f=products.filter(p=>(!s||p.name.toLowerCase().includes(s))&&(!cf||p.category===cf)&&(!countyF||p.county===countyF));g.innerHTML=f.map(p=>`<div class="bg-white rounded-xl border overflow-hidden"><img src="${p.image}" class="h-32 w-full object-cover"><div class="p-2"><p class="text-[9px] text-gray-500">${p.county} • ${p.category}</p><p class="font-bold text-sm h-8 overflow-hidden">${p.name}</p><p class="font-black">L$${Number(p.price).toLocaleString()}</p><button onclick="addToCart(${p.id})" class="mt-2 w-full bg-black text-white rounded-full py-1.5 text-xs font-bold">Add to Cart</button></div></div>`).join('');}
function addToCart(id){let p=products.find(x=>x.id===id);let ex=cart.find(x=>x.id===id);if(ex)ex.qty++;else cart.push({...p,qty:1});updateCart();document.getElementById('cartModal').classList.remove('hidden');}
function updateCart(){document.getElementById('cartCount').textContent=cart.reduce((a,b)=>a+b.qty,0);let t=0;document.getElementById('cartItems').innerHTML=cart.map(c=>{t+=c.price*c.qty;return `<div class="flex justify-between text-sm"><span>${c.name} x${c.qty}</span><span>L$${(c.price*c.qty).toLocaleString()}</span></div>`}).join('');document.getElementById('cartTotal').textContent='L$'+t.toLocaleString();}
document.getElementById('search').addEventListener('input',render);document.getElementById('catFilter').addEventListener('change',render);document.getElementById('countyFilter').addEventListener('change',render);document.getElementById('cartBtn').addEventListener('click',()=>document.getElementById('cartModal').classList.remove('hidden'));
document.getElementById('checkoutBtn').addEventListener('click',async()=>{if(!cart.length)return alert('Empty');let name=document.getElementById('custName').value||'Guest';let total=cart.reduce((a,b)=>a+b.price*b.qty,0);try{await fetch(BACKEND+"/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:name,total,items:cart})});await fetch(BACKEND+"/api/pay/wave",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount:total})});alert('Order Success ID WBL-'+Date.now()+' Total L$'+total);}catch(e){alert('Order Local Total L$'+total);}cart=[];updateCart();document.getElementById('cartModal').classList.add('hidden');});
let pressTimer=null;const logo=document.getElementById('logoBtn');function startPress(e){e.preventDefault();pressTimer=setTimeout(()=>{let em=prompt('Owner email:');if(em==='christopher200c@gmail.com'){isOwner=true;alert('Owner Portal Open - christopher200c@gmail.com - Montserrado');}else alert('Press-hold detected but owner login required');},2000);}function endPress(){clearTimeout(pressTimer);}logo.addEventListener('mousedown',startPress);logo.addEventListener('touchstart',startPress);logo.addEventListener('mouseup',endPress);logo.addEventListener('touchend',endPress);let taps=0;logo.addEventListener('click',()=>{taps++;setTimeout(()=>taps=0,1000);if(taps>=5){let em=prompt('Owner email:');if(em==='christopher200c@gmail.com'){isOwner=true;alert('Owner via 5 taps');}}});
loadBackend();
</script>
</body>
</html>
